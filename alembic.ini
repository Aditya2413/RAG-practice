# Alembic configuration file

[alembic]
# Path to migration scripts, relative to this file (project root)
script_location = src/infrastructure/database/postgres/migrations

# Template for new migration filenames
file_template = %%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# sqlalchemy.url is intentionally left blank here.
# It is read from environment variables inside env.py via src.core.config.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
